<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>จัดการสถานะโครงการ — CR-Vision</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              prompt: ["Prompt", "sans-serif"],
              sarabun: ["Sarabun", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Auth Guard — role: approve (treasury) -->
    <script src="gas-config.js"></script>
    <script src="auth.js"></script>
    <script>
      var __session = window.CRAuth.requireRole(["approve"]);
    </script>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Sarabun", sans-serif;
      }
      h1,
      h2,
      h3,
      .font-heading {
        font-family: "Prompt", sans-serif;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(71, 85, 105, 0.5);
        border-radius: 3px;
      }

      .spinner {
        border: 3px solid rgba(59, 130, 246, 0.15);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Status badges */
      .status-badge {
        font-size: 0.7rem;
        padding: 0.15rem 0.55rem;
        border-radius: 9999px;
        font-weight: 600;
        white-space: nowrap;
      }
      .s-wait {
        background: #1e3a5f;
        color: #93c5fd;
        border: 1px solid #1d4ed8;
      }
      .s-progress {
        background: #422006;
        color: #fbbf24;
        border: 1px solid #92400e;
      }
      .s-done {
        background: #052e16;
        color: #4ade80;
        border: 1px solid #166534;
      }
      .s-cancel {
        background: #3f1818;
        color: #f87171;
        border: 1px solid #991b1b;
      }
      .s-pause {
        background: #2d2b2b;
        color: #94a3b8;
        border: 1px solid #475569;
      }

      /* Status select */
      .status-select {
        background: #334155;
        border: 1px solid #475569;
        border-radius: 0.5rem;
        color: #f1f5f9;
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        outline: none;
        cursor: pointer;
      }
      .status-select:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
      }

      /* Toast */
      #toast {
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      #toast.hide {
        opacity: 0;
        transform: translateY(-10px);
        pointer-events: none;
      }

      .filter-input {
        background: #334155;
        border: 1px solid #475569;
        border-radius: 0.625rem;
        color: #f1f5f9;
        font-size: 0.8125rem;
        padding: 0.45rem 0.75rem;
        outline: none;
        width: 100%;
      }
      .filter-input:focus {
        border-color: #3b82f6;
      }
    </style>
  </head>

  <body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col">
    <!-- ── TOP BAR ─────────────────────────────────────── -->
    <header
      class="flex-shrink-0 bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-20"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-purple-400 flex items-center justify-center"
        >
          <i data-lucide="radar" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h1 class="font-heading text-sm font-bold text-white leading-none">
            จัดการสถานะโครงการ
          </h1>
          <p class="text-[10px] text-violet-400">CR-Vision · อบจ.เชียงราย</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div
          class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-violet-900/40 border border-violet-700/50 rounded-full"
        >
          <i data-lucide="landmark" class="w-3.5 h-3.5 text-violet-400"></i>
          <span id="userLabel" class="text-xs text-violet-300 font-medium"
            >การเงิน/คลัง</span
          >
        </div>
        <a
          href="index.html"
          class="hidden md:flex items-center gap-1 text-xs text-gray-400 hover:text-white transition-colors px-2 py-1"
        >
          <i data-lucide="map" class="w-3.5 h-3.5"></i> แผนที่
        </a>
        <button
          id="logoutBtn"
          class="flex items-center gap-1.5 px-3 py-1.5 text-xs text-gray-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">ออกจากระบบ</span>
        </button>
      </div>
    </header>

    <!-- Toast -->
    <div
      id="toast"
      class="hide fixed top-16 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl text-sm font-medium border max-w-xs"
    >
      <i
        id="toastIcon"
        data-lucide="check-circle"
        class="w-4 h-4 flex-shrink-0"
      ></i>
      <span id="toastMsg"></span>
    </div>

    <!-- ── MAIN ──────────────────────────────────────────── -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-5">
      <!-- Filter Bar -->
      <div
        class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-4 flex flex-wrap gap-3 items-end"
      >
        <div class="flex-1 min-w-[130px]">
          <label class="block text-xs text-gray-400 mb-1">ปีงบประมาณ</label>
          <select id="filterYear" class="filter-input" onchange="loadData()">
            <option value="">ทุกปี</option>
            <option value="2570">2570</option>
            <option value="2569" selected>2569</option>
            <option value="2568">2568</option>
            <option value="2567">2567</option>
            <option value="2566">2566</option>
          </select>
        </div>
        <div class="flex-1 min-w-[130px]">
          <label class="block text-xs text-gray-400 mb-1">อำเภอ</label>
          <input
            id="filterDistrict"
            type="text"
            class="filter-input"
            placeholder="ค้นหาอำเภอ..."
            oninput="filterTable()"
          />
        </div>
        <div class="flex-1 min-w-[130px]">
          <label class="block text-xs text-gray-400 mb-1">สถานะ</label>
          <select
            id="filterStatus"
            class="filter-input"
            onchange="filterTable()"
          >
            <option value="">ทุกสถานะ</option>
            <option>รอดำเนินการ</option>
            <option>กำลังดำเนินการ</option>
            <option>แล้วเสร็จ</option>
            <option>ยกเลิก</option>
            <option>ระงับชั่วคราว</option>
          </select>
        </div>
        <div class="flex-1 min-w-[130px]">
          <label class="block text-xs text-gray-400 mb-1">ค้นหาโครงการ</label>
          <input
            id="filterSearch"
            type="text"
            class="filter-input"
            placeholder="ชื่อโครงการ..."
            oninput="filterTable()"
          />
        </div>
        <button
          onclick="loadData()"
          class="flex items-center gap-1.5 px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-colors"
        >
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> โหลดใหม่
        </button>
      </div>

      <!-- Stats row -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4" id="statsRow">
        <div
          class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center"
        >
          <p class="text-xl font-bold text-white" id="statTotal">—</p>
          <p class="text-xs text-gray-400">โครงการทั้งหมด</p>
        </div>
        <div
          class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center"
        >
          <p class="text-xl font-bold text-amber-400" id="statProgress">—</p>
          <p class="text-xs text-gray-400">กำลังดำเนินการ</p>
        </div>
        <div
          class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center"
        >
          <p class="text-xl font-bold text-emerald-400" id="statDone">—</p>
          <p class="text-xs text-gray-400">แล้วเสร็จ</p>
        </div>
        <div
          class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center"
        >
          <p class="text-xl font-bold text-blue-400" id="statWait">—</p>
          <p class="text-xs text-gray-400">รอดำเนินการ</p>
        </div>
      </div>

      <!-- Table card -->
      <div
        class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden"
      >
        <!-- Loading overlay -->
        <div
          id="loadingOverlay"
          class="p-12 flex flex-col items-center gap-3 text-gray-400"
        >
          <div class="spinner" style="width: 36px; height: 36px"></div>
          <p class="text-sm">กำลังโหลดข้อมูล...</p>
        </div>

        <!-- Empty state -->
        <div
          id="emptyState"
          class="hidden p-12 flex flex-col items-center gap-2 text-gray-500"
        >
          <i data-lucide="inbox" class="w-10 h-10 opacity-40"></i>
          <p class="text-sm">ไม่พบข้อมูลโครงการ</p>
        </div>

        <!-- Table -->
        <div id="tableWrap" class="hidden overflow-x-auto custom-scroll">
          <table class="w-full text-sm text-left">
            <thead
              class="text-xs font-medium text-gray-400 bg-slate-700/60 border-b border-slate-700"
            >
              <tr>
                <th class="px-4 py-3 w-10">#</th>
                <th class="px-4 py-3 min-w-[220px]">ชื่อโครงการ</th>
                <th class="px-4 py-3 w-16">ปีงบ</th>
                <th class="px-4 py-3 w-28">อำเภอ</th>
                <th class="px-4 py-3 w-24">ตำบล</th>
                <th class="px-4 py-3 w-32 text-right">งบประมาณ</th>
                <th class="px-4 py-3 w-44">สถานะการดำเนินงาน</th>
                <th class="px-4 py-3 w-20 text-center">บันทึก</th>
              </tr>
            </thead>
            <tbody
              id="tableBody"
              class="divide-y divide-slate-700/50 text-gray-200"
            ></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div
          id="pagination"
          class="hidden px-4 py-3 border-t border-slate-700 flex items-center justify-between text-xs text-gray-400"
        >
          <span id="pageInfo"></span>
          <div class="flex items-center gap-2">
            <button
              id="prevBtn"
              onclick="changePage(-1)"
              class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
            >
              ← ก่อนหน้า
            </button>
            <span
              id="pageNum"
              class="px-3 py-1.5 bg-blue-600 text-white rounded-lg font-medium"
              >1</span
            >
            <button
              id="nextBtn"
              onclick="changePage(1)"
              class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
            >
              ถัดไป →
            </button>
          </div>
        </div>
      </div>

      <!-- Save note -->
      <p class="text-xs text-gray-600 mt-3 text-center">
        <i data-lucide="info" class="w-3 h-3 inline"></i>
        การเงิน/คลังสามารถแก้ไขเฉพาะ "สถานะการดำเนินงาน" เท่านั้น
      </p>
    </main>

    <script>
      var session = window.CRAuth.getSession();
      if (session) {
        document.getElementById("userLabel").textContent =
          session.displayRole || window.CRAuth.getRoleLabel(session.role);
      }
      document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {
          window.CRAuth.logout();
        });

      lucide.createIcons();

      // ─── Data & Pagination ────────────────────────────────
      var ALL_PROJECTS = [];
      var FILTERED = [];
      var PAGE_SIZE = 30;
      var currentPage = 1;

      var STATUS_CLASSES = {
        รอดำเนินการ: "s-wait",
        กำลังดำเนินการ: "s-progress",
        แล้วเสร็จ: "s-done",
        ยกเลิก: "s-cancel",
        ระงับชั่วคราว: "s-pause",
      };

      var STATUSES = [
        "รอดำเนินการ",
        "กำลังดำเนินการ",
        "แล้วเสร็จ",
        "ยกเลิก",
        "ระงับชั่วคราว",
      ];

      // ─── Load data via GAS ───────────────────────────────
      async function loadData() {
        showLoading(true);
        var year = document.getElementById("filterYear").value;
        try {
          var res = await window.CRAuth.callGAS({
            action: "getProjects",
            token: session.token,
            year: year,
          });
          if (!res.success) throw new Error(res.error);
          ALL_PROJECTS = res.data || [];
          filterTable();
          updateStats();
        } catch (err) {
          showToast("โหลดข้อมูลไม่สำเร็จ: " + err.message, "error");
          showEmpty();
        } finally {
          showLoading(false);
        }
      }

      function filterTable() {
        var district = document
          .getElementById("filterDistrict")
          .value.trim()
          .toLowerCase();
        var status = document.getElementById("filterStatus").value;
        var search = document
          .getElementById("filterSearch")
          .value.trim()
          .toLowerCase();

        FILTERED = ALL_PROJECTS.filter(function (p) {
          var title = (p["ชื่อโครงการ"] || "").toString().toLowerCase();
          var dist = (p["อำเภอ"] || "").toString().toLowerCase();
          var pStatus = (p["สถานะ"] || "").toString();

          if (district && dist.indexOf(district) === -1) return false;
          if (status && pStatus !== status) return false;
          if (search && title.indexOf(search) === -1) return false;
          return true;
        });

        currentPage = 1;
        renderPage();
        updateStats();
      }

      function renderPage() {
        var tbody = document.getElementById("tableBody");
        var start = (currentPage - 1) * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, FILTERED.length);
        var slice = FILTERED.slice(start, end);

        if (slice.length === 0) {
          showEmpty();
          return;
        }

        tbody.innerHTML = slice
          .map(function (p, idx) {
            var rowId = parseInt(p["ที่"] || 0);
            var year = (p["_sheet"] || "").toString();
            var status = (p["สถานะ"] || "รอดำเนินการ").toString();
            var budget = parseFloat(p["งบประมาณ"] || 0);
            var budgetFmt = isNaN(budget)
              ? "—"
              : budget.toLocaleString("th-TH") + " ฿";

            var options = STATUSES.map(function (s) {
              return (
                '<option value="' +
                escHtml(s) +
                '" ' +
                (s === status ? "selected" : "") +
                ">" +
                escHtml(s) +
                "</option>"
              );
            }).join("");

            return (
              '<tr class="hover:bg-slate-700/30 transition-colors" id="row-' +
              start +
              idx +
              '">' +
              '<td class="px-4 py-3 text-gray-500 text-xs">' +
              (start + idx + 1) +
              "</td>" +
              '<td class="px-4 py-3">' +
              '<p class="font-medium text-white leading-snug line-clamp-2 max-w-xs">' +
              escHtml(p["ชื่อโครงการ"] || "") +
              "</p>" +
              "</td>" +
              '<td class="px-4 py-3 text-gray-400 text-xs">' +
              escHtml(year) +
              "</td>" +
              '<td class="px-4 py-3 text-gray-300 text-xs">' +
              escHtml(p["อำเภอ"] || "") +
              "</td>" +
              '<td class="px-4 py-3 text-gray-400 text-xs">' +
              escHtml(p["ตำบล"] || "") +
              "</td>" +
              '<td class="px-4 py-3 text-right text-gray-300 text-xs font-mono whitespace-nowrap">' +
              budgetFmt +
              "</td>" +
              '<td class="px-4 py-3">' +
              '<select class="status-select" data-row-id="' +
              rowId +
              '" data-year="' +
              escHtml(year) +
              '">' +
              options +
              "</select>" +
              "</td>" +
              '<td class="px-4 py-3 text-center">' +
              '<button onclick="saveStatus(this, ' +
              rowId +
              ", '" +
              escJs(year) +
              "')\"" +
              ' class="px-2.5 py-1 text-xs font-semibold bg-slate-700 hover:bg-violet-700 text-gray-300 hover:text-white rounded-lg transition-colors">' +
              "บันทึก" +
              "</button>" +
              "</td>" +
              "</tr>"
            );
          })
          .join("");

        document.getElementById("tableWrap").classList.remove("hidden");
        document.getElementById("emptyState").classList.add("hidden");
        updatePagination();
      }

      function updatePagination() {
        var total = FILTERED.length;
        var pages = Math.ceil(total / PAGE_SIZE);
        var start = (currentPage - 1) * PAGE_SIZE + 1;
        var end = Math.min(currentPage * PAGE_SIZE, total);

        document.getElementById("pageInfo").textContent =
          "แสดง " +
          (total > 0 ? start : 0) +
          "–" +
          end +
          " จาก " +
          total +
          " รายการ";
        document.getElementById("pageNum").textContent = currentPage;
        document.getElementById("prevBtn").disabled = currentPage <= 1;
        document.getElementById("nextBtn").disabled = currentPage >= pages;
        document
          .getElementById("pagination")
          .classList.toggle("hidden", total === 0);
      }

      function changePage(delta) {
        var pages = Math.ceil(FILTERED.length / PAGE_SIZE);
        currentPage = Math.max(1, Math.min(pages, currentPage + delta));
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateStats() {
        var src = FILTERED.length > 0 ? FILTERED : ALL_PROJECTS;
        var total = src.length;
        var prog = src.filter(function (p) {
          return (p["สถานะ"] || "") === "กำลังดำเนินการ";
        }).length;
        var done = src.filter(function (p) {
          return (p["สถานะ"] || "") === "แล้วเสร็จ";
        }).length;
        var wait = src.filter(function (p) {
          return (p["สถานะ"] || "") === "รอดำเนินการ";
        }).length;
        document.getElementById("statTotal").textContent =
          total.toLocaleString("th-TH");
        document.getElementById("statProgress").textContent =
          prog.toLocaleString("th-TH");
        document.getElementById("statDone").textContent =
          done.toLocaleString("th-TH");
        document.getElementById("statWait").textContent =
          wait.toLocaleString("th-TH");
      }

      // ─── Save status ──────────────────────────────────────
      async function saveStatus(btn, rowId, year) {
        // หา select ใน row เดียวกัน
        var tr = btn.closest("tr");
        var select = tr.querySelector(".status-select");
        var status = select ? select.value : "";

        if (!status || !rowId || !year) {
          showToast("ข้อมูลไม่ครบถ้วน", "error");
          return;
        }

        // ยืนยันก่อนบันทึก
        if (!confirm('ยืนยันการเปลี่ยนสถานะเป็น "' + status + '" ?')) return;

        btn.disabled = true;
        btn.textContent = "...";

        try {
          var res = await window.CRAuth.callGAS({
            action: "updateStatus",
            token: session.token,
            rowId: rowId,
            year: year,
            status: status,
          });
          if (res.success) {
            showToast("อัปเดตสถานะสำเร็จ", "ok");
            // อัปเดต local data
            ALL_PROJECTS.forEach(function (p) {
              if (
                parseInt(p["ที่"]) === rowId &&
                (p["_sheet"] || "") === year
              ) {
                p["สถานะ"] = status;
              }
            });
          } else {
            showToast(res.error || "เกิดข้อผิดพลาด", "error");
          }
        } catch (err) {
          showToast("ไม่สามารถเชื่อมต่อได้: " + err.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "บันทึก";
        }
      }

      // ─── UI helpers ───────────────────────────────────────
      function showLoading(on) {
        document
          .getElementById("loadingOverlay")
          .classList.toggle("hidden", !on);
        document.getElementById("tableWrap").classList.toggle("hidden", on);
        document.getElementById("emptyState").classList.add("hidden");
        document.getElementById("pagination").classList.toggle("hidden", on);
      }
      function showEmpty() {
        document.getElementById("tableWrap").classList.add("hidden");
        document.getElementById("emptyState").classList.remove("hidden");
        document.getElementById("pagination").classList.add("hidden");
      }

      var _toastTimer = null;
      function showToast(msg, type) {
        var toast = document.getElementById("toast");
        clearTimeout(_toastTimer);
        document.getElementById("toastMsg").textContent = msg;
        var isOk = type !== "error";
        toast.className =
          "fixed top-16 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl text-sm font-medium border max-w-xs " +
          (isOk
            ? "bg-emerald-900/80 border-emerald-700 text-emerald-300"
            : "bg-red-900/80    border-red-700    text-red-300");
        var icon = document.getElementById("toastIcon");
        icon.setAttribute("data-lucide", isOk ? "check-circle" : "x-circle");
        lucide.createIcons({ nodes: [icon] });
        _toastTimer = setTimeout(function () {
          toast.classList.add("hide");
        }, 4000);
      }

      function escHtml(str) {
        return (str || "")
          .toString()
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escJs(str) {
        return (str || "").toString().replace(/'/g, "\\'");
      }

      // ─── Init ─────────────────────────────────────────────
      loadData();
    </script>
  </body>
</html>
