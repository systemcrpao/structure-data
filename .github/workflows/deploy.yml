name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # สร้าง dashboard-config.js จาก GitHub Secrets
      # (ไฟล์นี้ไม่อยู่ใน repo แต่ถูกสร้างขณะ build)
      - name: Generate dashboard config
        run: |
          cat > frontend/dashboard-config.js << 'EOF'
          window.DASHBOARD_CONFIG = {
            USERNAME:      "${{ secrets.DASH_USERNAME }}",
            PASSWORD_HASH: "${{ secrets.DASH_PASSWORD_HASH }}",
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "frontend"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
